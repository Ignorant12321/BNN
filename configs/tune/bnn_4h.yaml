name: bnn_4h_optuna
base_config: ../models/bnn/4h.yaml
output_dir: outputs
study_name: bnn_4h_optuna
direction: minimize
metric: val_rmse
n_trials: 100

# batch_size 固定为 BNN 默认配置中的 64；这里只搜索训练超参数。
search_space:
  lr:
    type: log_float
    low: 0.0001
    high: 0.001
  weight_decay:
    type: log_float
    low: 0.00001
    high: 0.001
  kl_beta:
    type: log_float
    low: 0.0000001
    high: 0.0001
