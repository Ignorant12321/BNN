name: bnn_optuna
base_config: ../models/bnn/24h.yaml
output_dir: outputs
study_name: bnn_optuna
direction: minimize
metric: val_rmse
n_trials: 20

# 默认 storage 是 outputs/tuning/<name>/study.db。
# 中断后重复运行同一个配置，会继续补足到 n_trials 个完成 trial。
search_space:
  lr:
    type: log_float
    low: 0.0001
    high: 0.001
  kl_beta:
    type: log_float
    low: 0.0000001
    high: 0.0001
