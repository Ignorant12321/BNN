include:
  - cnn.yaml

model:
  hidden_dim: 32
  branch_dim: 32

data:
  lookback: 16
  horizon: 16
  features:
    history:
      - AC_POWER
    weather:
      - IRRADIATION
      - AMBIENT_TEMPERATURE
      - MODULE_TEMPERATURE
      - hour_sin
      - hour_cos
      - dayofyear_sin
      - dayofyear_cos
      - is_generation_time
    direct:
      - AC_POWER
    target: AC_POWER

training:
  epochs: 300
  early_stopping:
    enabled: true
    patience: 30
    min_delta: 0.0
    metric: val_generation_nrmse
