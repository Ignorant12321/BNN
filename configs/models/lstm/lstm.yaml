include:
  - ../../data.yaml

model:
  name: lstm_baseline
  hidden_dim: 128
  num_layers: 1

training:
  backend: torch
  device: auto
  epochs: 300
  batch_size: 64
  lr: 0.0005
  weight_decay: 0.0001
  early_stopping:
    enabled: true
    patience: 30
    min_delta: 0.0
    metric: val_generation_nrmse
