seed: 42
output_dir: outputs

data:
  generation_path: dataset/Plant_1_Generation_Data.csv
  weather_path: dataset/Plant_1_Weather_Sensor_Data.csv
  processed_dir: data/processed
  fill_missing: true
  train_ratio: 0.7
  val_ratio: 0.15
  lookback: 16
  horizon: 16

model:
  name: improved_bnn
  hidden_dim: 256
  branch_dim: 64
  prior_sigma: 1.0

training:
  device: auto
  epochs: 200
  batch_size: 128
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  amp: true
  cudnn_benchmark: true
  lr: 0.0018259913257430906
  weight_decay: 0.0001
  kl_beta: 1.7099712671569545e-05
  patience: 15

prediction:
  mc_samples: 64

tuning:
  study_name: improved_bnn_tuning_crps
  storage: sqlite:///outputs/tuning/optuna.db
  load_if_exists: true
  n_trials: 500
  objective_metric: crps
  search_space:
    hidden_dim: [256]
    branch_dim: [256]
    lr:
      low: 1.0e-4
      high: 1.0e-2
      log: true
    kl_beta:
      low: 1.0e-5
      high: 1.0e-3
      log: true
