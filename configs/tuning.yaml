seed: 42
output_dir: outputs

data:
  generation_path: dataset/Plant_1_Generation_Data.csv
  weather_path: dataset/Plant_1_Weather_Sensor_Data.csv
  processed_dir: data/processed
  fill_missing: true
  train_ratio: 0.7
  val_ratio: 0.15
  lookback: 16
  horizon: 16

model:
  name: improved_bnn
  hidden_dim: 256
  branch_dim: 64
  prior_sigma: 1.0

training:
  device: auto
  epochs: 100
  batch_size: 128
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  amp: true
  cudnn_benchmark: true
  lr: 0.00019544293665253097
  weight_decay: 0.0001
  kl_beta: 1.2114960587728605e-05
  patience: 12

prediction:
  mc_samples: 30
  plot:
    prefer_daylight: true
    daylight_threshold: 1.0
    max_points: 160
    start_time: "2020-06-13 10:00:00"
    end_time: "2020-06-13 14:00:00"

tuning:
  n_trials: 50

evaluation:
  run_test: true
