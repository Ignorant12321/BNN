seed: 42
output_dir: outputs

data:
  generation_path: dataset/Plant_1_Generation_Data.csv
  weather_path: dataset/Plant_1_Weather_Sensor_Data.csv
  fill_missing: true
  train_ratio: 0.7
  val_ratio: 0.15
  lookback: 32
  horizon: 16
  use_future_weather: false

model:
  name: improved_bnn
  hidden_dim: 256
  branch_dim: 64
  prior_sigma: 1.0

training:
  device: auto
  epochs: 60
  batch_size: 64
  lr: 0.00019544293665253097
  weight_decay: 0.0001
  kl_beta: 1.2114960587728605e-05
  patience: 10

prediction:
  mc_samples: 50
  plot:
    prefer_daylight: true
    daylight_threshold: 1.0
    max_points: 160
    # start_time: "2020-06-13 08:00:00"
    # end_time: "2020-06-13 12:00:00"

compare:
  models:
    - improved_bnn
    - mlp_baseline
    - cnn_baseline
    - mc_dropout

evaluation:
  run_test: true
