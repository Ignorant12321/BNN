seed: 42
output_dir: outputs
data:
  generation_path: dataset/Plant_1_Generation_Data.csv
  weather_path: dataset/Plant_1_Weather_Sensor_Data.csv
  fill_missing: true
  train_ratio: 0.7
  val_ratio: 0.15
  lookback: 32
  horizon: 16
  use_future_weather: true
model:
  name: improved_bnn
  hidden_dim: 256
  branch_dim: 32
  prior_sigma: 1.0
training:
  device: auto
  epochs: 250
  batch_size: 64
  lr: 0.0015414419590646007
  weight_decay: 0.0001
  kl_beta: 9.839179320060641e-05
  patience: 20
prediction:
  mc_samples: 30
  plot:
    prefer_daylight: true
    daylight_threshold: 1.0
    max_points: 160
tuning:
  n_trials: 20
evaluation:
  run_test: true
