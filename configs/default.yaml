seed: 42
output_dir: outputs

data:
  generation_path: dataset/Plant_1_Generation_Data.csv
  weather_path: dataset/Plant_1_Weather_Sensor_Data.csv
  fill_missing: true
  train_ratio: 0.7
  val_ratio: 0.15
  lookback: 96
  horizon: 16

model:
  name: improved_bnn
  hidden_dim: 128
  branch_dim: 64
  prior_sigma: 1.0

training:
  device: auto
  epochs: 80
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  kl_beta: 0.0001
  patience: 12

prediction:
  mc_samples: 50
