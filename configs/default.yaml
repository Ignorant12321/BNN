seed: 42
output_dir: outputs
data:
  generation_path: dataset/Plant_1_Generation_Data.csv
  weather_path: dataset/Plant_1_Weather_Sensor_Data.csv
  fill_missing: true
  train_ratio: 0.7
  val_ratio: 0.15
  lookback: 32
  horizon: 16
  use_future_weather: true
model:
  name: improved_bnn
  hidden_dim: 256
  branch_dim: 64
  prior_sigma: 1.0
training:
  device: auto
  epochs: 300
  batch_size: 128
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  amp: true
  cudnn_benchmark: true
  lr: 0.0007621948724043314
  weight_decay: 0.0001
  kl_beta: 1.0053915983841731e-05
  patience: 30
prediction:
  mc_samples: 30
  plot:
    prefer_daylight: true
    daylight_threshold: 1.0
    max_points: 160
    start_time: "2020-06-13 10:00:00"
    end_time: "2020-06-13 14:00:00"
tuning:
  n_trials: 20
evaluation:
  run_test: true
