<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BNN 实验结果对比</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">BNN Run Visualizer</p>
        <h1>实验结果对比</h1>
      </div>
      <div class="actions">
        <button id="sidebarToggle" class="button" type="button">隐藏侧栏</button>
        <label class="button primary" for="folderInput">添加实验文件夹</label>
        <input id="folderInput" type="file" webkitdirectory multiple />
        <button id="clearButton" class="button" type="button">清空</button>
        <button id="exportButton" class="button" type="button">导出 JSON</button>
      </div>
    </header>

    <section id="summaryStats" class="summary-strip"></section>

    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2>已添加 run</h2>
          <span id="runCount">0</span>
        </div>
        <label class="sidebar-search">
          <span>搜索 run</span>
          <input id="runSearch" type="search" placeholder="smoke / 193755" />
        </label>
        <div id="runList" class="run-list">
          <p class="empty">还没有添加实验文件夹。</p>
        </div>
      </aside>

      <section class="content">
        <section class="panel dashboard-panel">
          <div class="panel-head">
            <div>
              <h2>可视化概览</h2>
              <p>用可见 run 自动绘制核心指标和预测步长趋势。</p>
            </div>
            <div class="control-row">
              <label>
                指标
                <select id="metricSelect">
                  <option value="rmse">rmse</option>
                  <option value="mae">mae</option>
                  <option value="nrmse">nrmse</option>
                  <option value="smape">smape</option>
                  <option value="nll">nll</option>
                  <option value="picp_90">picp_90</option>
                  <option value="pinaw_90">pinaw_90</option>
                  <option value="picp_95">picp_95</option>
                  <option value="pinaw_95">pinaw_95</option>
                </select>
              </label>
              <label>
                Horizon
                <select id="horizonMetricSelect">
                  <option value="rmse">rmse</option>
                  <option value="mae">mae</option>
                </select>
              </label>
            </div>
          </div>
          <div id="visualCharts" class="chart-grid"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>指标对比</h2>
              <p>测试集与验证集核心指标，深色标记当前最佳。</p>
            </div>
          </div>
          <div id="metricsTable" class="table-wrap"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>参数对比</h2>
              <p>默认只显示不同 run 之间不一致的配置项。</p>
            </div>
            <label class="switch">
              <input id="diffOnlyToggle" type="checkbox" checked />
              <span>只显示差异参数</span>
            </label>
            <label class="search-box">
              <span>搜索</span>
              <input id="paramSearch" type="search" placeholder="training.lr" />
            </label>
          </div>
          <div id="paramsTable" class="table-wrap"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>Horizon 指标</h2>
              <p>来自每个 run 的 <code>metrics/point_metrics.csv</code>。</p>
            </div>
          </div>
          <div id="pointMetrics" class="point-grid"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>图像对比</h2>
              <p>按同名图像分组，横向比较各个 run。</p>
            </div>
            <label class="search-box">
              <span>筛选</span>
              <input id="figureSearch" type="search" placeholder="loss / interval / rmse" />
            </label>
          </div>
          <div id="figureComparison" class="figure-comparison"></div>
        </section>
      </section>
    </main>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <div class="lightbox-backdrop" data-lightbox-close></div>
      <section class="lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
        <header class="lightbox-head">
          <div>
            <p id="lightboxRun" class="lightbox-run"></p>
            <h2 id="lightboxTitle">图像预览</h2>
            <p id="lightboxPath" class="lightbox-path"></p>
          </div>
          <button id="lightboxClose" class="icon-button" type="button" aria-label="关闭">×</button>
        </header>
        <div class="lightbox-stage">
          <button id="lightboxPrev" class="nav-button prev" type="button" aria-label="上一张">‹</button>
          <img id="lightboxImage" alt="" />
          <button id="lightboxNext" class="nav-button next" type="button" aria-label="下一张">›</button>
        </div>
        <footer id="lightboxCounter" class="lightbox-counter"></footer>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
